# One scale set that runs GitHub Actions jobs for one repository, one VM per job.
# Required keys are marked "required"; everything else shows its default or is optional.

# trace, debug, info, warn or error.
log_level = "info"

# Prometheus /metrics. It has no authentication, so keep it on loopback or
# behind a firewall. Leave the key out to serve no metrics.
listen_address = "127.0.0.1:9253"

# Integer seconds that SIGTERM waits for shutdown. SIGQUIT drains instead.
shutdown_timeout = 30

[[scalesets]]
# required: the scale set name. Created on GitHub at the first run.
name = "example"
# required: the repository the GitHub App is installed on, as
# https://github.com/<owner>/<repo> (no trailing slash or .git).
url = "https://github.com/owner/repo"
# required: workflows select this scale set with runs-on.
labels = ["self-hosted", "example"]

[scalesets.github_app]
# required: the App's client ID, its installation ID on the repository, and
# the path of its private key (PEM). The App needs Administration read and write.
client_id = "Iv1.0000000000000000"
installation_id = 12345678
private_key_path = "/run/credentials/forgehand.service/app.pem"

[scalesets.runner]
# required: where actions/runner is unpacked in the guest image.
dir = "/opt/actions-runner"

[scalesets.autoscaler]
# required: a fleeting plugin, as a binary path, a name on PATH or an OCI reference.
plugin = "fleeting-plugin-libvirt"
# required: the most VMs this scale set may hold at once.
max_instances = 4
# Readiness gate. Run in the guest over SSH once it connects (the connection
# retries until connector_config.timeout); a VM takes a job only after it exits 0.
# With it unset, a VM whose SSH is not yet up fails the pre-job check and is deleted.
instance_ready_command = "true"
# optional: how long a job waits for a VM before it is given up. Default "15m".
instance_acquire_timeout = "15m"

# The keys here belong to the plugin; forgehand passes them through untouched.
# Each scale set needs its own name_prefix. These are fleeting-plugin-libvirt's.
[scalesets.autoscaler.plugin_config]
pool_name = "images"
base_volume_name = "golden.qcow2"
name_prefix = "forgehand-"

[scalesets.autoscaler.connector_config]
protocol = "ssh"
# the guest user. The plugin generates the SSH key pair itself. To use a key
# the image already trusts instead, set use_static_credentials = true and
# key_path = "/run/credentials/forgehand.service/guest-ssh". Only then does a
# restart adopt the VMs of running jobs; the state lives under the unit's
# StateDirectory, in a directory named after the scale set.
username = "runner"
timeout = "10m"

# Idle VMs kept warm. idle_count = 0 starts a VM only when a job arrives.
[[scalesets.autoscaler.policy]]
idle_count = 0
